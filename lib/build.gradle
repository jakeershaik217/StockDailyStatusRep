allprojects {
    // Apply the java-library plugin for API and implementation separation.
    apply plugin: 'java'
    apply plugin: 'maven-publish'


repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
}

dependencies {
    implementation platform('com.fasterxml.jackson:jackson-bom:2.21.4')
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'com.google.code.gson:gson:2.13.1'
    implementation 'com.jayway.jsonpath:json-path:2.9.0'
    implementation 'commons-logging:commons-logging:1.3.5'
    implementation 'io.rest-assured:json-path:5.5.6'
    implementation 'io.rest-assured:json-schema-validator:5.5.6'
    implementation 'io.rest-assured:rest-assured:5.5.6'
    implementation 'io.rest-assured:xml-path:5.5.6'
    implementation 'org.apache.commons:commons-email:1.6.0'
    implementation 'org.apache.logging.log4j:log4j-core:2.25.4'
    implementation 'org.apache.pdfbox:pdfbox:2.0.36'
    implementation 'org.apache.poi:poi:5.5.1'
    implementation 'org.apache.poi:poi-ooxml:5.5.1'
    implementation 'org.jsoup:jsoup:1.22.2'
    implementation 'org.seleniumhq.selenium:selenium-java:4.45.0'
    implementation 'org.testng:testng:7.12.0'

    constraints {
        implementation('com.google.guava:guava:33.6.0-jre')
        implementation('com.sun.mail:jakarta.mail:1.6.8')
        implementation('commons-io:commons-io:2.20.0')
        implementation('net.minidev:json-smart:2.5.2')
        implementation('org.apache.commons:commons-compress:1.28.0')
        implementation('org.apache.commons:commons-lang3:3.19.0')
        implementation('org.mozilla:rhino:1.9.1')
    }
}

task DailyRun(type:Test){
useTestNG(){

suites 'testng.xml'

}


}


task ShareHoldingChange(type:Test){
useTestNG(){

suites 'ShareHoldingChange.xml'

}


}

task ShareAllocation(type:Test){
useTestNG(){

suites 'ShareAllocation.xml'

}


}


task PromoterBuying(type:Test){
useTestNG(){

suites 'PromoterBuying.xml'

}


}

task LatestUpdatesFromStocks(type:Test){
useTestNG(){

suites 'LatestUpdatesFromStocks.xml'

}


}

